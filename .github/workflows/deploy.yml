# Every push to main: typecheck, build and run the QA checks, then publish the built
# site (dist/) to the `deploy` branch. The Spaceship server polls that branch every
# minute (deploy/spaceship/deploy.sh) and switches to the new build atomically.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, build and QA
        run: npm run verify

      - name: Publish dist/ to the deploy branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          for f in index.html 404.html robots.txt sitemap.xml llms.txt .htaccess; do
            test -s "dist/$f" || { echo "::error::dist/$f missing"; exit 1; }
          done
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Published ${GITHUB_SHA::7} to the deploy branch. The server picks it up within a minute." >> "$GITHUB_STEP_SUMMARY"
